[package]
name = "steamtron-core"
version.workspace = true
edition.workspace = true

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
sha2 = "0.10"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
