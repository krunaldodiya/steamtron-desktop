[package]
name = "steamtron-overlay-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "steamtron-overlay"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
steamtron-overlay = { path = "../steamtron-overlay" }
steamtron-core = { path = "../steamtron-core" }
steamtron-unlock = { path = "../steamtron-unlock" }
steamtron-doctor = { path = "../steamtron-doctor" }
thiserror = "2"
anyhow = "1"
serde_json = "1"
