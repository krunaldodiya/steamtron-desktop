[package]
name = "steamtron-desktop"
version.workspace = true
edition.workspace = true
description = "Open-source Steam library, fixes, and managed-game manager"
license = "MIT"
repository = "https://github.com/krunaldodiya/steamtron-desktop"
homepage = "https://steamtron.vercel.app"
authors = ["Krunal Dodiya"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", features = ["json", "blocking"] }
chrono = "0.4"
tokio = { version = "1", features = ["sync"] }
webbrowser = "1"
flate2 = "1"
xz2 = "0.1"
tar = "0.4"
sha2 = "0.10"
libc = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
regex = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
steamtron-core = { path = "../steamtron-core" }
steamtron-overlay = { path = "../steamtron-overlay" }
steamtron-register = { path = "../steamtron-register" }
steamtron-doctor = { path = "../steamtron-doctor" }
steamtron-auth = { path = "../steamtron-auth" }
steamtron-library = { path = "../steamtron-library" }
anyhow = "1"
steamless-core = { git = "https://github.com/staernid/steamless-rs", rev = "5886222dfdbb4f707c9dfa2fd37510297b7147d7" }
sevenz-rust = "0.6.1"
notify-rust = "4"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
