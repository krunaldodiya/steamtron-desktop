[package]
name = "steamtron-desktop"
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
rfd = "0.15"
steamtron-core = { path = "../steamtron-core" }
steamtron-overlay = { path = "../steamtron-overlay" }
steamtron-unlock = { path = "../steamtron-unlock" }
steamtron-doctor = { path = "../steamtron-doctor" }
anyhow = "1"
