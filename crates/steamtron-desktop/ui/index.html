<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SteamTron</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="auth-gate" class="auth-gate">
    <div class="auth-card">
      <h1>SteamTron</h1>
      <p class="muted">Sign in before using the desktop app. Adding games and Steam library actions stay locked until your session is active.</p>
      <button id="gate-signin" class="primary">Sign in</button>
      <div id="gate-status" class="status"></div>
    </div>
  </div>
  <header class="topbar">
    <div>
      <h1>SteamTron</h1>
      <p class="muted">Steam fixes and overlay manager</p>
    </div>
    <div class="top-actions">
      <button id="activity" class="secondary activity-button">Activity<span id="activity-count" class="activity-count hidden">0</span></button>
      <button id="add-game" class="primary">+ Add Game</button>
      <button id="settings" class="secondary">Settings</button>
    </div>
  </header>
  <div id="restart-banner" class="restart-banner hidden" role="status" aria-live="polite">
    <span id="restart-banner-text">SteamTron changed Steam library files.</span>
    <button id="restart-banner-button" class="primary">Restart Steam</button>
    <button id="restart-banner-dismiss" class="banner-dismiss" aria-label="Dismiss">×</button>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <main class="layout">
    <aside class="panel library-panel">
      <div class="library-toolbar">
        <input id="search" class="search" placeholder="Search installed games">
        <button id="refresh" class="secondary">Refresh</button>
      </div>
      <div id="games" class="games"></div>
    </aside>
    <section id="detail" class="panel detail">
      <div class="empty">Select a Steam game.</div>
    </section>
  </main>
  <div id="activity-backdrop" class="drawer-backdrop hidden"></div>
  <aside id="activity-drawer" class="activity-drawer hidden" aria-label="Activity">
    <div class="drawer-head"><div><h2>Activity</h2><p class="muted">Operations from this computer</p></div><button id="activity-close" class="modal-close" aria-label="Close activity">×</button></div>
    <div id="activity-list" class="activity-list"></div>
    <div class="drawer-actions"><button id="activity-clear" class="secondary">Clear history</button></div>
  </aside>
  <script src="app.js"></script>
</body>
</html>
