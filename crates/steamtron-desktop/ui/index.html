<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SteamTron</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="auth-gate" class="auth-gate">
    <div class="auth-modal" role="dialog" aria-modal="true" aria-labelledby="auth-title">
      <div class="auth-modal-head">Sign in · SteamTron</div>
      <div class="auth-lock" aria-hidden="true">🔒</div>
      <h2 id="auth-title">Sign in to SteamTron</h2>
      <p id="gate-status" class="auth-status">Opening your browser to sign in…</p>
      <div class="auth-spinner" id="gate-spinner" aria-hidden="true"></div>
      <div class="auth-actions">
        <button id="gate-retry" class="secondary">Retry</button>
        <button id="gate-quit" class="primary">Quit</button>
      </div>
    </div>
  </div>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div class="brand-text">
        <h1>SteamTron</h1>
        <p class="muted">Play Steam games without Steam</p>
      </div>
    </div>
    <nav class="top-nav" aria-label="Primary">
      <button id="nav-home" class="nav-item">Home</button>
      <button id="nav-library" class="nav-item active" aria-current="page">Library</button>
    </nav>
    <div class="top-actions">
      <button id="add-game" class="primary">+ Add Game</button>
      <button id="settings" class="secondary">Settings</button>
    </div>
  </header>
  <div id="restart-banner" class="restart-banner hidden" role="status" aria-live="polite">
    <span id="restart-banner-text">SteamTron changed Steam library files.</span>
    <button id="restart-banner-button" class="primary">Restart Steam</button>
    <button id="restart-banner-dismiss" class="banner-dismiss" aria-label="Dismiss">×</button>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="settings-page" class="settings-page hidden" role="dialog" aria-modal="true" aria-label="Settings">
    <header class="settings-topbar">
      <div class="settings-search-icon" aria-hidden="true">⌕</div>
      <nav class="settings-tabs" aria-label="Settings sections">
        <button class="settings-tab active" data-settings-tab="general">General</button>
        <button class="settings-tab" data-settings-tab="storage">Storage</button>
        <button class="settings-tab" data-settings-tab="proton">Proton Manager</button>
      </nav>
      <button id="settings-close" class="settings-close" aria-label="Close settings">×</button>
    </header>
    <div class="settings-scroll"><div id="settings-body"></div></div>
  </div>
  <main class="layout">
    <aside class="panel library-panel">
      <div class="library-toolbar">
        <input id="search" class="search" placeholder="Search installed games">
        <button id="refresh" class="secondary">Refresh</button>
      </div>
      <div id="games" class="games"></div>
    </aside>
    <section id="detail" class="panel detail">
      <div class="empty">Select a Steam game.</div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
