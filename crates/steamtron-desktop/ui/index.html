<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SteamTron</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="auth-gate" class="auth-gate">
    <div class="auth-modal" role="dialog" aria-modal="true" aria-labelledby="auth-title">
      <div class="auth-modal-head">Sign in · SteamTron</div>
      <div class="auth-lock" aria-hidden="true">🔒</div>
      <h2 id="auth-title">Sign in to SteamTron</h2>
      <p id="gate-status" class="auth-status">Sign in to SteamTron to manage your Steam library.</p>
      <div class="auth-spinner hidden" id="gate-spinner" aria-hidden="true"></div>
      <div class="auth-actions">
        <button id="gate-quit" class="secondary">Quit</button>
        <button id="gate-signin" class="primary">Sign in</button>
      </div>
    </div>
  </div>
  <div id="profile-dialog" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="profile-title">
    <div class="modal profile-modal">
      <div class="game-settings-head"><h2 id="profile-title">Account · SteamTron</h2><button class="modal-close" id="profile-close-icon" aria-label="Close">×</button></div>
      <div class="profile-body">
        <div class="auth-lock" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path></svg>
        </div>
        <h3>Signed in</h3>
        <p id="profile-email" class="auth-status">…</p>
        <p id="profile-base" class="auth-status" style="opacity:.7"></p>
      </div>
      <div class="modal-actions profile-actions"><button id="profile-logout" class="danger">Log out</button></div>
    </div>
  </div>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div class="brand-text">
        <h1>SteamTron</h1>
        <p class="muted">Steam on Steroids</p>
      </div>
    </div>
    <nav class="top-nav" aria-label="Primary">
      <button id="nav-home" class="nav-item active" aria-current="page">Home</button>
      <button id="nav-library" class="nav-item">Library</button>
      <button id="nav-store" class="nav-item">Store</button>
    </nav>
    <div class="top-actions">
      <button id="window-mode" class="profile-button" aria-label="Switch to Fullscreen mode (F11)" title="Switch to Fullscreen mode (F11)">
        <svg class="icon-enter" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg>
        <svg class="icon-exit" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"></path></svg>
      </button>
      <button id="settings" class="profile-button" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9c.23.63.83 1.03 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"></path></svg>
      </button>
      <button id="profile" class="profile-button" aria-label="Account" aria-haspopup="menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path></svg>
      </button>
    </div>
  </header>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="settings-page" class="settings-page hidden" role="dialog" aria-modal="true" aria-label="Settings">
    <header class="settings-topbar">
      <div class="settings-search-icon" aria-hidden="true">⌕</div>
      <nav class="settings-tabs" aria-label="Settings sections">
        <button class="settings-tab active" data-settings-tab="general">General</button>
        <button class="settings-tab" data-settings-tab="storage">Storage</button>
        <button class="settings-tab" data-settings-tab="proton">Proton Manager</button>
      </nav>
      <button id="settings-close" class="settings-close" aria-label="Close settings">×</button>
    </header>
    <div class="settings-scroll"><div id="settings-body"></div></div>
  </div>
  <main class="layout">
    <aside class="panel library-panel">
      <div class="library-toolbar">
        <input id="search" class="search" placeholder="Search installed games">
        <button id="refresh" class="secondary">Refresh</button>
      </div>
      <div id="games" class="games"></div>
    </aside>
    <section id="detail" class="panel detail">
      <div class="empty">Select a Steam game.</div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
