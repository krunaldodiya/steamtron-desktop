name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
            artifact: steamtron-linux
          - name: Windows
            os: windows-latest
            bundles: nsis
            artifact: steamtron-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            libfuse2

      - name: Install Windows build dependencies
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # winfsp-sys reads HKLM\SOFTWARE\WOW6432Node\WinFsp\InstallDir.
          # The runner image no longer guarantees that key, so install the
          # pinned MSI and register the header directory explicitly.
          $msi = Join-Path $env:RUNNER_TEMP "winfsp-2.1.25156.msi"
          Invoke-WebRequest "https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi" -OutFile $msi
          $process = Start-Process msiexec.exe -ArgumentList @("/i", "`"$msi`"", "/qn", "/norestart", "ADDLOCAL=ALL") -Wait -PassThru
          if ($process.ExitCode -notin 0, 3010) { throw "WinFsp MSI failed: $($process.ExitCode)" }
          $dir = @(
            "${env:ProgramFiles(x86)}\WinFsp",
            "$env:ProgramFiles\WinFsp"
          ) | Where-Object { Test-Path (Join-Path $_ "inc\winfsp\winfsp.h") } | Select-Object -First 1
          if (-not $dir) {
            Get-ChildItem "${env:ProgramFiles(x86)}", "$env:ProgramFiles" -Directory -Filter WinFsp -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Output ('WinFsp dir: ' + $_.FullName); Get-ChildItem $_.FullName -Force | Select-Object Name }
            throw "WinFsp Developer headers not found after install"
          }
          New-Item -Path "HKLM:\SOFTWARE\WOW6432Node\WinFsp" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\WOW6432Node\WinFsp" -Name InstallDir -Value $dir
          Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\WinFsp" | Format-List
          Test-Path (Join-Path $dir "inc\winfsp\winfsp.h")

      - name: Build bundles
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }}
        shell: bash


      - name: Build prerequisite bootstrapper
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $assets = Join-Path $env:RUNNER_TEMP "bootstrap-assets"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          Invoke-WebRequest "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "$assets\vc_redist.x64.exe"
          Invoke-WebRequest "https://aka.ms/dotnet/9.0/windowsdesktop-runtime-win-x64.exe" -OutFile "$assets\windowsdesktop-runtime-9.0-win-x64.exe"
          Invoke-WebRequest "https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi" -OutFile "$assets\winfsp-2.1.25156.msi"
          $inner = Get-ChildItem "target/release/bundle/nsis/*.exe" | Select-Object -First 1
          Copy-Item $inner.FullName "$assets\SteamTron-app-setup.exe"
          $version = (Get-Content "crates/steamtron-desktop/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $out = "target/release/bundle/nsis/SteamTron_${version}_x64-setup.exe"
          $makensis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { throw "makensis not found at $makensis" }
          & $makensis `
            /DINNER_INSTALLER="$assets\SteamTron-app-setup.exe" `
            /DVC_INSTALLER="$assets\vc_redist.x64.exe" `
            /DDOTNET_INSTALLER="$assets\windowsdesktop-runtime-9.0-win-x64.exe" `
            /DWINFSP_INSTALLER="$assets\winfsp-2.1.25156.msi" `
            /DOUT="$PWD/$out" `
            /DVERSION="$version" `
            "crates/steamtron-desktop/windows/bootstrapper.nsi"

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify changelog entry
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -qE "^## \[${version}\]" CHANGELOG.md

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f ! -name 'SHA256SUMS.txt' -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: SteamTron ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.exe
            artifacts/SHA256SUMS.txt
